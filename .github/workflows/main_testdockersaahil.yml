# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - testdockersaahil

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: testdockersaahil.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C73725DB580F4B95BB90393D6226C07D }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_4ED04CFD69B7445EACE2FE9795458EEB }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: testdockersaahil.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C73725DB580F4B95BB90393D6226C07D }}/ml-project:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9FBFA013A81E4740B4865738953AA0FC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9460F62D2B9A4157AAD2C7CF12A2DC69 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B51CE6FBEBC54E379B2B67D0DB72D9D9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'testdockersaahil'
          slot-name: 'Production'
          images: 'testdockersaahil.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C73725DB580F4B95BB90393D6226C07D }}/ml-project:${{ github.sha }}'
          